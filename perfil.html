<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>SESI Leitura+ - Perfil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#F0F0F0] m-0 flex justify-center items-center min-h-screen p-3 md:p-5">

  <div class="w-full max-w-[500px] md:max-w-[600px] bg-white rounded-2xl md:rounded-[36px] shadow-lg md:shadow-[0_30px_80px_rgba(0,0,0,0.18)] overflow-hidden p-5 md:p-7">
    
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 md:w-11 md:h-11 bg-[#C1121F] rounded-xl flex items-center justify-center">
          <svg viewBox="0 0 24 24" fill="white" class="w-5 h-5 md:w-6 md:h-6"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div>
          <h1 class="text-lg md:text-xl font-bold font-['Sora'] text-[#1A1A2E]">Meu <span class="text-[#C1121F]">Perfil</span></h1>
          <p class="text-[10px] md:text-xs text-[#888888]">Suas informações pessoais</p>
        </div>
      </div>
      <a href="home.html" class="text-xs text-gray-500 hover:text-[#C1121F]">← Voltar</a>
    </div>

    <div class="text-center mb-6">
      <div class="w-24 h-24 bg-gradient-to-r from-[#C1121F] to-[#8B0000] rounded-full flex items-center justify-center mx-auto mb-3">
        <span class="text-4xl text-white" id="avatar">👤</span>
      </div>
      <h2 class="text-xl font-bold" id="perfilNome">Carregando...</h2>
      <p class="text-sm text-gray-500" id="perfilRm">RM: </p>
    </div>

    <div class="space-y-4">
      <div class="bg-gray-50 rounded-xl p-4">
        <p class="text-xs text-gray-500 mb-1">E-mail</p>
        <p class="font-medium" id="perfilEmail">-</p>
      </div>
      
      <div class="bg-gray-50 rounded-xl p-4">
        <p class="text-xs text-gray-500 mb-1">Membro desde</p>
        <p class="font-medium" id="perfilData">2024</p>
      </div>
      
      <div class="bg-gray-50 rounded-xl p-4">
        <p class="text-xs text-gray-500 mb-1">Total de minutos lidos</p>
        <p class="font-bold text-2xl text-[#C1121F]" id="totalMinutos">45</p>
      </div>
      
      <div class="bg-gray-50 rounded-xl p-4">
        <p class="text-xs text-gray-500 mb-1">Livros concluídos</p>
        <p class="font-bold text-2xl text-[#C1121F]" id="livrosConcluidos">2</p>
      </div>
    </div>

    <button onclick="logout()" class="w-full mt-6 bg-red-600 text-white rounded-xl py-3 font-semibold hover:bg-red-700 transition-colors">
      Sair da conta
    </button>
  </div>

  <script>
    function carregarPerfil() {
      let usuario = localStorage.getItem('usuario');
      if (!usuario) {
        usuario = sessionStorage.getItem('usuario');
      }
      
      if (!usuario) {
        window.location.href = 'index.html';
        return;
      }
      
      const dados = JSON.parse(usuario);
      document.getElementById('perfilNome').textContent = dados.nome || 'Usuário';
      document.getElementById('perfilRm').textContent = `RM: ${dados.rm || '-'}`;
      document.getElementById('perfilEmail').textContent = dados.email || 'Não informado';
      document.getElementById('perfilData').textContent = new Date().getFullYear().toString();
      
      const primeiraLetra = (dados.nome || 'U').charAt(0).toUpperCase();
      document.getElementById('avatar').textContent = primeiraLetra;
    }
    
    function logout() {
      localStorage.removeItem('usuario');
      sessionStorage.removeItem('usuario');
      window.location.href = 'index.html';
    }
    
    carregarPerfil();
  </script>
</body>
</html>
