<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SESI Leitura+ - Criar Conta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'DM Sans', sans-serif; }
    h1, h2, h3, button { font-family: 'Sora', sans-serif; }
  </style>
</head>
<body class="bg-[#F0F0F0] m-0 flex justify-center items-center min-h-screen p-5 font-['DM_Sans'] antialiased">

  <div class="w-full max-w-[480px] bg-white rounded-2xl shadow-lg p-8">
    
    <div class="flex items-center gap-2.5 mb-2">
      <div class="w-11 h-11 bg-[#C1121F] rounded-xl flex items-center justify-center">
        <svg viewBox="0 0 24 24" fill="white" class="w-6 h-6"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
      </div>
      <div>
        <h1 class="text-2xl font-bold font-['Sora'] text-[#1A1A2E] m-0">Criar <span class="text-[#C1121F]">Conta</span></h1>
        <p class="text-xs text-[#888888] m-0">Cadastre-se para começar a ler</p>
      </div>
    </div>

    <div class="h-[1px] bg-gray-100 my-6"></div>

    <form id="cadastroForm">
      <div class="mb-4">
        <label class="text-xs font-semibold text-gray-700 block mb-1.5">Nome Completo</label>
        <input type="text" name="nome" required class="border border-gray-200 rounded-xl p-3 w-full text-sm outline-none bg-gray-50 focus:border-[#C1121F] focus:bg-white transition-colors" />
      </div>

      <div class="mb-4">
        <label class="text-xs font-semibold text-gray-700 block mb-1.5">RM (Número da matrícula)</label>
        <input type="text" name="rm" placeholder="3247639" required class="border border-gray-200 rounded-xl p-3 w-full text-sm outline-none bg-gray-50 focus:border-[#C1121F] focus:bg-white transition-colors" />
      </div>

      <div class="mb-4">
        <label class="text-xs font-semibold text-gray-700 block mb-1.5">E-mail</label>
        <input type="email" name="email" required class="border border-gray-200 rounded-xl p-3 w-full text-sm outline-none bg-gray-50 focus:border-[#C1121F] focus:bg-white transition-colors" />
      </div>

      <div class="mb-4">
        <label class="text-xs font-semibold text-gray-700 block mb-1.5">Senha</label>
        <input type="password" name="senha" required class="border border-gray-200 rounded-xl p-3 w-full text-sm outline-none bg-gray-50 focus:border-[#C1121F] focus:bg-white transition-colors" />
      </div>

      <div class="mb-6">
        <label class="text-xs font-semibold text-gray-700 block mb-1.5">Confirmar Senha</label>
        <input type="password" name="confirmar_senha" required class="border border-gray-200 rounded-xl p-3 w-full text-sm outline-none bg-gray-50 focus:border-[#C1121F] focus:bg-white transition-colors" />
      </div>

      <button type="submit" class="bg-[#C1121F] text-white rounded-xl p-3.5 text-sm font-bold cursor-pointer w-full tracking-wide hover:bg-[#a00e19] transition-colors font-['Sora']">
        CADASTRAR →
      </button>

      <div class="mt-6 text-center">
        <p class="text-xs text-gray-600">Já tem uma conta? 
          <a href="index.html" class="text-[#C1121F] font-semibold hover:underline">Fazer login</a>
        </p>
      </div>
    </form>

    <p class="text-center text-[10px] text-gray-300 mt-6 pt-4">Termos de Uso · Privacidade · SESI</p>
  </div>

  <script>
    const API_URL = 'https://sesileitura-back.vercel.app';

    document.getElementById('cadastroForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const form = event.currentTarget;
      const nome = form.nome.value.trim();
      const rm = form.rm.value.trim();
      const email = form.email.value.trim();
      const senha = form.senha.value;
      const confirmarSenha = form.confirmar_senha.value;

      if (senha !== confirmarSenha) {
        alert('As senhas não coincidem!');
        return;
      }

      const botao = form.querySelector('button[type="submit"]');
      const textoOriginal = botao.innerHTML;
      botao.innerHTML = 'CADASTRANDO...';
      botao.disabled = true;

      try {
        const resposta = await fetch(`${API_URL}/api/cadastro`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, rm, matricula: rm, email, senha })
        });

        const resultado = await resposta.json();

        if (resposta.ok) {
          alert('Conta criada com sucesso! Faça login.');
          window.location.href = 'index.html';
        } else {
          alert(resultado.mensagem || 'Erro ao criar conta. Tente novamente.');
          botao.innerHTML = textoOriginal;
          botao.disabled = false;
        }
      } catch (erro) {
        console.error('Erro:', erro);
        alert('Erro ao conectar com o servidor.');
        botao.innerHTML = textoOriginal;
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
