<body class="bg-[#F0F0F0] m-0 flex justify-center items-start min-h-screen p-5 font-['DM_Sans'] antialiased">

          <div class="text-[11px] font-bold text-gray-600">4.820 pts</div>
        </div>

        <div class="flex flex-col items-center gap-1.5 w-[80px]">
          <div class="h-5"></div>
          <div class="w-12 h-12 rounded-full bg-[#444444] flex items-center justify-center text-white font-bold text-sm font-['Sora'] border-3 border-yellow-400">3B</div>

            1º C
          </div>
          <div class="text-[11px] font-bold text-gray-600">4.150 pts</div>
